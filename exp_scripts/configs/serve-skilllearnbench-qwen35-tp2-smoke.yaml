# SMOKE (batch 4 episodes, 1 critic-only step) of: SAO on SkillLearnBench office tasks (user, 2026-10-14), Qwen3.5-4B, .16 (2x RTX 6000 Ada 48 GB).
# serve-appworld-qwen35-tp2.yaml (smoked 2026-10-09: 32k samples, TP2 + colocated SGLang, no OOM) with only
# what the SkillLearnBench protocol changes:
#  1. One episode = one sample (MultiTurnSAORecipe, as the AppWorld/FinQA SAO lines), scored with the
#     episode's verifier ctrf test-pass fraction. Per-turn samples (the ceobench pattern) were smoked first
#     (2026-10-14 13:35): ~50 s per 25k-token actor microbatch, ~2.4 h per 128-turn step, ~5 days per epoch,
#     so the user switched to whole episodes (16 per step, ~20 steps per epoch).
#  2. Synchronous batches (run.py): SLB_BATCH episodes on one weight version, then wait for the step to publish.
# Model, Qwen3.5 spec, attention (+ TE FA2 patch), LoRA, objective, sampling (T=1.0) and the 32k window
# are the AppWorld TP2 config's.
schema-version: 2
reef:
  host: 0.0.0.0                        # STACK_NETWORK=private: Reef is reached through the published port
  port: 8900
  token: reef-local
  run-dir: /var/lib/reef/stack
  ready-timeout: 3600

inference:
  model-path: /root/models/qwen35-4b-851bf6e8-eosfix
  num-gpus: "2"                      # one TP1 SGLang engine per GPU, colocated with training
  tensor-parallel-size: "1"
  timeout-s: 7200
  retry-timeout-s: 7200                # upstream serve-30b: requests survive an engine restart
  retry-max-s: 60
  options:
    router-port: "30000"
    context-length: "32768"          # measured 2507 AppWorld episodes up to 19.7k tokens
    # --- upstream serve-30b.yaml ---
    disable-radix-cache: true          # "Required by Reef's SGLang inference backend (#432)"
    incremental-streaming-output: true
    mem-fraction-static: "0.7"
    chunked-prefill-size: "4096"
    max-running-requests: "16"
    # --- ours ---
    watchdog-timeout: "1800"
    tool-call-parser: "qwen3_coder"         # Qwen3-2507 <tool_call>{json}</tool_call> (vLLM: hermes)
  handler-factory: reef.inference.sglang.chat.SGLangInferenceHandler
  handler-config:
    tool_call_parser: qwen3_coder
    # Thinking is off per request (driver --no_think), but Reef sniffs the default template, which
    # ends with an open <think>, and would file every reply under reasoning_content (smoke
    # 2026-10-08: correct tool calls, empty content). The explicit value wins over the sniff.
    force_reasoning: false

recipe:
  implementation: sao_multiturn:MultiTurnSAORecipe   # exp_scripts/finqa, on the container PYTHONPATH
  config:
    batch-size: 4                     # episodes per step; MUST equal global_batch_size and run.py SLB_BATCH
    max-staleness: 18
    checkpoint-every-n-versions: 20    # durable Reef versions (~1 epoch); every step's adapter is kept by sidecar.py
    accept-multi-turn-policy-samples: true   # one episode = one sample (skip-observation GAE)
    realign-threshold: 4096            # long re-rendered tool calls drift up to ~1.3k tokens (smoke 2026-10-14); default 1024

training:
  backend: slime
  colocate: true                       # SGLang and actor/critic share both GPUs (--sync)
  ready-timeout: 1800
  timeout-s: 14400
  config:
    checkpoint_dir: /var/lib/reef/checkpoints
    global_batch_size: 4
  options:
    megatron-to-hf-mode: "bridge"
    hf-checkpoint: "${inference.model-path}"
    load: "${training.config.checkpoint_dir}/megatron"
    save: "${training.config.checkpoint_dir}/megatron"
    save-interval: "100"
    save-hf: "${training.config.checkpoint_dir}/hf/{rollout_id}"
    num-rollout: "100000000"
    rollout-batch-size: "${training.config.global_batch_size}"
    global-batch-size: "${training.config.global_batch_size}"
    micro-batch-size: "1"

    # --- topology: actor + critic TP2 over both GPUs, SGLang colocated (one engine per GPU) ---
    actor-num-nodes: "1"
    actor-num-gpus-per-node: "2"
    num-gpus-per-node: "2"
    tensor-model-parallel-size: "2"
    pipeline-model-parallel-size: "1"

    # --- Qwen3-4B-Instruct-2507 architecture: slime scripts/models/qwen3-4B-Instruct-2507.sh ---
    # Only the flags Reef cannot derive from the HF config.
    disable-bias-linear: true
    qk-layernorm: true
    group-query-attention: true
    normalization: "RMSNorm"
    position-embedding-type: "rope"
    swiglu: true
    padded-vocab-size: "248320"
    rotary-base: "10000000"
    spec:
      - slime_plugins.models.qwen3_5
      - get_qwen3_5_spec
    use-gated-attention: true
    attention-output-gate: true
    apply-layernorm-1p: true
    rotary-percent: "0.25"
    # auto: FlashAttention-2 with STACK_TE_FA2_SM89_HDIM256=1, else Unfused (header note 3).
    # "flash" fails outright without the patch (smoke 2026-10-08).
    attention-backend: "auto"

    # --- LoRA (memory-forced; values from the ceobench SAO config) ---
    megatron-lora-rank: "32"
    megatron-lora-alpha: "32"
    megatron-lora-dropout: "0"
    megatron-lora-target-modules:
      - linear_qkv
      - linear_proj
      - linear_fc1
      - linear_fc2
    # 3 engine adapter slots (Reef docs, evolve-your-model.rst: one per scenario
    # plus one for the revision being published). The default 1 deadlocked the
    # step-2 publication: evicting adapter :1 to load :2 waited on the 127
    # requests still pinned to :1, which the in-place pause had frozen, and the
    # unload hit its 600 s timeout (run 2026-09-23 17:43, 22:07:54Z). It also
    # sets max-loras-per-batch, so old- and new-revision requests batch together
    # instead of draining the engine to one running request before each publish.
    max-loaded-loras: "3"
    check-lora-weight-equal: true
    verify-lora-base-weights: true
    # --no-offload-train is deliberately NOT set: on one 48 GB card the actor
    # and the colocated critic cannot both stay resident, and leaving it off
    # lets Slime offload whichever is idle between critic and actor steps.

    # --- sequence window ---
    # DeepCoder completions from this model: mean 2,171 tokens in the GRPO
    # run; the eval protocol allows 16,384. The response cap here keeps the
    # training step's memory bounded; the driver's SAO_MAX_TOKENS must not
    # exceed it.
    seq-length: "32768"
    rollout-max-response-len: "32768"  # Slime metrics only; the driver sets max_tokens per call
    rollout-max-context-len: "32768"   # = context-length
    recompute-granularity: "full"
    recompute-method: "uniform"
    recompute-num-layers: "1"
    log-probs-chunk-size: "1024"
    use-dynamic-batch-size: true
    max-tokens-per-gpu: "16384"   # = FinQA (48 GB .16); a longer single sample gets a micro-batch of its own
    sequence-parallel: true            # with TP2: activations split along the sequence (hf_attention handles GDN)
    # Offload swap plus a checkpoint save per step can starve SGLang's health
    # endpoint past the 30 s default (observed on the IMO attempt).
    rollout-health-check-timeout: "1200"
    # Rolling window of ~15 bundles; see note 6 in the header.
    reef-checkpoint-max-storage: "400GB"
    reef-checkpoint-adapter-only: true
    attention-dropout: "0.0"
    hidden-dropout: "0.0"
    attention-softmax-in-fp32: true
    accumulate-allreduce-grads-in-fp32: true

    # --- OBJECTIVE: upstream imo_answerbench values, unchanged except the
    #     two LoRA learning rates (10x, keeping the paper's 5:1 critic ratio) ---
    optimizer: "adam"
    lr: "1e-5"                         # upstream full-param: 1e-6
    lr-decay-style: "constant"
    loss-type: "policy_loss"
    use-rollout-logprobs: true
    use-critic: true
    eps-clip: "0.3"
    eps-clip-high: "5.0"
    critic-steps-per-actor: "2"
    critic-lr: "5e-5"                  # upstream full-param: 5e-6
    num-critic-only-steps: "1"
    sao-length-adaptive-lambda: true
    sao-lambda-alpha: "1.5"
    gamma: "1.0"
    lambd: "1.0"
    entropy-coef: "0.0"
    n-samples-per-prompt: "1"
    rollout-temperature: "1.0"         # = grpo_vanilla AppWorld line; must match the driver's SAO_TEMPERATURE

storage:
  artifact-repository: /var/lib/reef/artifacts.git
  artifact-work-dir: /var/lib/reef/artifact-work
  artifact-cache-dir: /var/lib/reef/artifact-cache
  agent-record-dir: /var/lib/reef/agent-record

observability:
  wandb:
    enabled: false
    project: reef-sao-skilllearnbench-qwen35-tp2
    mode: offline
    directory: /var/lib/reef/wandb
